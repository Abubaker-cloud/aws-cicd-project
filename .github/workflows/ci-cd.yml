
name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 464097497854.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: aws-cicd-app
  EC2_INSTANCE_ID: i-02c73cccedf9b7e61
  AWS_ROLE_ARN: arn:aws:iam::464097497854:role/aws-cicd-github-actions-role

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest -v

  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          REMOTE_COMMAND=$(cat <<EOF
          set -euo pipefail

          cd /home/ssm-user/aws-cicd

          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

          sed -i -E "s|(image:[[:space:]]*)$ECR_REGISTRY/$ECR_REPOSITORY:[^[:space:]]+|\\1$IMAGE|" docker-compose.yml

          docker compose pull app
          docker compose up -d --no-deps app

          for i in {1..30}; do
            STATUS=\$(docker inspect --format '{{.State.Health.Status}}' flask-app 2>/dev/null || true)

            if [ "\$STATUS" = "healthy" ]; then
              echo "Application deployed and healthy!"
              exit 0
            fi

            sleep 2
          done

          docker logs flask-app
          exit 1
          EOF
          )

          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg command "$REMOTE_COMMAND" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [$command]
              },
              Comment: "Deploy AWS CI/CD application"
            }' > ssm-command.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
