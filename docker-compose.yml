services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask-app

    environment:
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "production"

    expose:
      - "5000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - app-network

    restart: unless-stopped


  nginx:
    image: nginx:1.28-alpine

    container_name: nginx-proxy

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    mem_limit: 128m
    cpus: 0.25


networks:
  app-network:
    driver: bridge
